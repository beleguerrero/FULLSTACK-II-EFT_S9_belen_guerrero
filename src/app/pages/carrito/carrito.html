
<ng-container *ngIf="carritoService.sumaCarrito$ | async as sumaCarrito; else sinProductos">

    <section class="page-content container">

        <ng-container *ngIf="cargando">
            cargando...
        </ng-container>

        <ng-container *ngIf="!cargando">
            <div class="row">
                <div class="col-12 col-md-8">
                    <div *ngFor="let pc of productosCarrito">
                        <div class="card mb-3 border-0 card-product overflow-auto">
                            <div class="row g-0">
                                <div class="col-md-2 product-img">
                                    <a [routerLink]="['/producto', pc.slug]">
                                        <img class="product-img" 
                                        [src]="pc.imagen"
                                        [alt]="pc.nombre">
                                    </a>
                                </div>
                                <div class="col-md-10">
                                    <div class="card-body h-100">
                                        <div class="row align-items-center d-flex h-100">
                                            <div class="col-12 col-md-8">
                                                <h5 class="card-title m-0">
                                                    <a class="link-body-emphasis text-decoration-none" [routerLink]="['/producto', pc.slug]">{{ pc.nombre }}</a>
                                                </h5>
                                                <p class="card-text">
                                                    {{ formatearPrecio(obtenerPrecioFinal(pc.precio, pc.monto_descuento, authService.esVip)) }}
                                                    <span 
                                                    class="price-before"
                                                    *ngIf="pc.monto_descuento || authService.esVip">{{ formatearPrecio(pc.precio) }}</span>
                                                </p>
                                            </div>
                                            <div class="col-8 col-md-2">
    
                                                <select class="form-select" aria-label="cantidad"
                                                [value]="pc.cantidad"
                                                (change)="cambioCantidad(pc, $event)">
                                                    <option value="1">1</option>
                                                    <option value="2">2</option>
                                                    <option value="3">3</option>
                                                    <option value="4">4</option>
                                                    <option value="5">5</option>
                                                    <option value="6">6</option>
                                                    <option value="7">7</option>
                                                    <option value="8">8</option>
                                                    <option value="9">9</option>
                                                    <option value="10">10</option>
                                                </select>
    
                                            </div>
                                            <div class="col-2 col-md-2 product-delete">
                                                <span class="d-block w-100 text-center">
                                                    <button class="btn"
                                                    (click)="eliminarProductoCarrito(pc.producto_id)">
                                                        <i class="bi bi-trash3"></i>
                                                    </button>
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
    
                </div>
    
                <div class="col-12 col-md-4">
                    <div class="card mb-3 border-0">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Resumen compra</h5>
                            <app-resumen-compra [resumenCompra]="resumenCarrito"></app-resumen-compra>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-12 d-block w-100 text-center">
                            <a routerLink="/checkout" class="btn btn-primary w-100 button">
                                Ir a pagar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

    </section>

</ng-container>

<ng-template #sinProductos>
    <section class="page-content container d-flex text-center">
        <div class="mx-auto">
            <p class="display-5">
                <i class="bi bi-cart-x"></i>
            </p>
            <p class="fs-5">
                Carrito vacío :(
            </p>
            <a class="btn btn-primary" routerLink="/">Ir al Home</a>
        </div>
    </section>
</ng-template>
